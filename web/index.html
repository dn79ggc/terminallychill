<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATL Rest Finder</title>
<style>
  :root { --bg:#ffffff; --fg:#1a1a1a; --muted:#666; --bar:#2563eb; --line:#e5e5e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#ececec; --muted:#9aa0a6; --bar:#60a5fa; --line:#2a2f36; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:.9rem; }
  .row { display:grid; grid-template-columns:2.2rem 1fr 3rem; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .bar { height:14px; background:var(--bar); border-radius:3px; min-width:2px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  #status { color:var(--muted); font-size:.85rem; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>ATL departures, next 2 hours</h1>
  <p class="sub">Scheduled departures per concourse (Tier A proof page: the real UI replaces this).</p>
  <div id="rows"></div>
  <p id="status">Loading...</p>
</main>
<script>
const rowsEl = document.getElementById("rows");
const statusEl = document.getElementById("status");

async function load() {
  try {
    const res = await fetch("/api/summary?hours=2");
    if (!res.ok) throw new Error("API returned " + res.status);
    const data = await res.json();
    const max = Math.max(1, ...data.by_concourse.map(r => r.departures));
    rowsEl.replaceChildren();
    for (const r of data.by_concourse) {
      if (r.concourse === "?" && r.departures === 0) continue;
      const row = document.createElement("div"); row.className = "row";
      const name = document.createElement("strong"); name.textContent = r.concourse;
      const bar = document.createElement("div"); bar.className = "bar"; bar.style.width = (100 * r.departures / max) + "%";
      const num = document.createElement("span"); num.className = "num"; num.textContent = r.departures;
      row.append(name, bar, num); rowsEl.append(row);
    }
    const fetched = data.last_fetched_at
      ? new Date(data.last_fetched_at).toLocaleString("en-US", { timeZone: data.tz, hour: "numeric", minute: "2-digit", month: "short", day: "numeric" })
      : "never";
    statusEl.textContent = data.total + " departures | source: " + (data.sources.join(", ") || "none") + " | data fetched: " + fetched + " (" + data.tz + ")";
  } catch (e) {
    statusEl.textContent = "Could not load data: " + e.message;
  }
}
load();
</script>
</body>
</html>
